<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft packs</title><style>:root{--bg:#fbfbfa;--fg:#1d1d1b;--muted:#5f5e5a;--line:#e3e2de;--accent:#2f6b3a}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--fg:#ecebe7;--muted:#a3a29c;--line:#33322f;--accent:#7fc28b}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}
main{max-width:44rem;margin:0 auto;padding:2rem 1rem 4rem}

.muted{color:var(--muted)}a{color:var(--accent)}code{font-size:.9em;overflow-wrap:anywhere}
.button{display:inline-block;padding:.6rem 1rem;border:1px solid var(--accent);border-radius:6px;text-decoration:none;font-weight:600}

<body><main>
<h1>Minecraft packs</h1>
<ul>
